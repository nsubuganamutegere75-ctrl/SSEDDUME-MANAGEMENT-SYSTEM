<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SSEDDUME DRUG SHOP MANAGEMENT SYSTEM — Mobile POS Terminal</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-soft: #ccfbf1;
      --accent: #0369a1;
      --accent-soft: #e0f2fe;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --radius: 14px;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 82px; }

    .topbar {
      background: linear-gradient(135deg, #0f172a, #115e59);
      color: #fff; padding: 13px 16px; position: sticky; top: 0; z-index: 30;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .brand { font-size: 14.5px; font-weight: 800; line-height: 1.25; }
    .sub { font-size: 11px; color: #cbd5e1; margin-top: 3px; }
    .pill {
      background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.26);
      color: #fff; padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .lock-btn {
      background: #fff; color: #0f172a; border: none; border-radius: 10px;
      padding: 7px 11px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }

    .wrap { padding: 12px 14px; max-width: 760px; margin: 0 auto; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }
    .card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 700; }

    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .kpi-lbl { font-size: 10.5px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .kpi-val { font-size: 18px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }

    .bridge-card {
      background: linear-gradient(135deg, #f0f9ff, #f0fdfa);
      border: 1px solid #bae6fd; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
    }
    .tag {
      display: inline-block; background: var(--accent-soft); color: var(--accent);
      font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; margin-bottom: 6px;
    }
    .tag.ok { background: var(--ok-soft); color: var(--ok); }
    .tag.warn { background: var(--warn-soft); color: var(--warn); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
    .ok { background: var(--ok-soft); color: var(--ok); }
    .warn { background: var(--warn-soft); color: var(--warn); }
    .bad { background: var(--danger-soft); color: var(--danger); }
    .info { background: var(--accent-soft); color: var(--accent); }

    .alert { border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; font-size: 12px; border: 1px solid transparent; }
    .alert-warn { background: var(--warn-soft); border-color: #fcd34d; color: #78350f; }
    .alert-bad { background: var(--danger-soft); border-color: #fca5a5; color: #7f1d1d; }

    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
    input, select, button {
      min-height: 40px; padding: 7px 11px; border-radius: 10px;
      border: 1px solid var(--border); font-size: 13.5px; background: #fff; color: var(--text);
    }
    button { font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.dark { background: #1e293b; color: #fff; border-color: #1e293b; }
    button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    button.ghost { background: var(--surface-2); color: var(--text); border-color: var(--border); min-height: 34px; padding: 4px 9px; font-size: 12px; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; background: #fff; }
    th { background: var(--surface-2); color: var(--muted); font-size: 10.5px; text-transform: uppercase; padding: 8px 9px; border-bottom: 1px solid var(--border); text-align: left; }
    td { padding: 8px 9px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; font-variant-numeric: tabular-nums; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
      border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px; z-index: 40;
    }
    .nav-btn {
      border: none; background: transparent; min-height: 50px; padding: 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: var(--muted); border-radius: 10px;
    }
    .nav-btn.active { background: var(--primary-soft); color: var(--primary-dark); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.86); z-index: 100; align-items: center; justify-content: center; padding: 14px; }
    .modal-box { background: #fff; border-radius: 14px; padding: 16px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; }
    video { width: 100%; border-radius: 10px; background: #000; max-height: 260px; object-fit: cover; }

    #toast {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 9px 15px; border-radius: 999px;
      font-size: 12.5px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 200;
    }
    #toast.show { opacity: 1; }

    @media print {
      .topbar, .bottom-nav, .no-print, #toast { display: none !important; }
      body { background: #fff; padding: 0; }
      .modal { position: static; background: none; display: block !important; }
      .modal-box { box-shadow: none; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="brand" id="topTitle">SSEDDUME DRUG SHOP MANAGEMENT SYSTEM</div>
      <div class="sub" id="topSub">Mobile POS Terminal • Offline-First</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span class="pill" id="rolePill">Owner • Full</span>
      <button class="lock-btn" onclick="switchClearancePrompt()">Switch / PIN</button>
    </div>
  </div>

  <div class="wrap" id="appMain"></div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="sell" onclick="setTab('sell')">💊<span>Sell</span></button>
    <button class="nav-btn" data-tab="stock" onclick="setTab('stock')">📦<span>Stock</span></button>
    <button class="nav-btn" data-tab="meds" onclick="setTab('meds')">📋<span>Meds</span></button>
    <button class="nav-btn" data-tab="reports" onclick="setTab('reports')">📊<span>Reports</span></button>
    <button class="nav-btn" data-tab="admin" onclick="setTab('admin')">🛡️<span>Admin</span></button>
  </nav>

  <div id="scannerModal" class="modal">
    <div class="modal-box">
      <h3 id="scanTitle" style="margin:0 0 8px;">Scan Gateway / Product QR</h3>
      <video id="scanVideo" playsinline autoplay muted></video>
      <div style="font-size:12px;color:var(--muted);margin:8px 0;">Point camera at the Windows Gateway QR code or medicine barcode.</div>
      <div class="row" style="margin-bottom:0;">
        <button class="ghost" style="flex:1;" onclick="manualQrEntry()">Paste / Enter Payload</button>
        <button class="danger" onclick="stopScanner()">Close</button>
      </div>
    </div>
  </div>

  <div id="voucherModal" class="modal">
    <div class="modal-box" id="voucherBox"></div>
  </div>

  <div id="toast"></div>

<script>
const BASE_DB_KEY = "sseddume_mobile_db_v5";
const PAIR_KEY = "sseddume_mobile_pair_v5";
const SESSION_KEY = "sseddume_mobile_session_v5";
const DEV_ID_KEY = "sseddume_mobile_dev_id_v5";

function getDevId() {
  let id = localStorage.getItem(DEV_ID_KEY);
  if (!id) {
    id = "AND-" + Math.random().toString(36).slice(2, 9).toUpperCase();
    localStorage.setItem(DEV_ID_KEY, id);
  }
  return id;
}
function money(n) { const x = Number(n); return Number.isFinite(x) ? Math.round((x + Number.EPSILON) * 100) / 100 : 0; }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function addDaysStr(days) { const d = new Date(); d.setDate(d.getDate() + days); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function nowIso() { return new Date().toISOString(); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function getPairing() {
  try {
    return JSON.parse(localStorage.getItem(PAIR_KEY) || "null") || {
      paired: false, role: "OWNER", branchCode: "LOC-MAIN", host: "", endpoint: "", token: ""
    };
  } catch (_) {
    return { paired: false, role: "OWNER", branchCode: "LOC-MAIN", host: "", endpoint: "", token: "" };
  }
}
function savePairing(p) { localStorage.setItem(PAIR_KEY, JSON.stringify(p)); }

function dbKeyForBranch() {
  const code = getPairing().branchCode || "LOC-MAIN";
  return `${BASE_DB_KEY}_${code}`;
}

function getSession() {
  try {
    return JSON.parse(localStorage.getItem(SESSION_KEY) || "null") || {
      role: "OWNER", ownerPin: "0000"
    };
  } catch (_) {
    return { role: "OWNER", ownerPin: "0000" };
  }
}
function saveSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }

function defaultMobileDb() {
  return { medicines: [], batches: [], sales: [], credits: [], audit: [], appliedEvents: [], outbox: [] };
}

function loadDb() {
  try {
    const raw = JSON.parse(localStorage.getItem(dbKeyForBranch()) || "null");
    if (raw && typeof raw === "object") {
      const d = defaultMobileDb();
      return {
        ...d, ...raw,
        medicines: Array.isArray(raw.medicines) ? raw.medicines : [],
        batches: Array.isArray(raw.batches) ? raw.batches : [],
        sales: Array.isArray(raw.sales) ? raw.sales : [],
        credits: Array.isArray(raw.credits) ? raw.credits : [],
        audit: Array.isArray(raw.audit) ? raw.audit : [],
        appliedEvents: Array.isArray(raw.appliedEvents) ? raw.appliedEvents : [],
        outbox: Array.isArray(raw.outbox) ? raw.outbox : []
      };
    }
  } catch (_) {}
  return defaultMobileDb();
}

let db = loadDb();
function saveDb() { localStorage.setItem(dbKeyForBranch(), JSON.stringify(db)); }

let activeTab = "sell";
let basket = [];
let scanMode = "PAIR";
let scanStream = null;
let scanTimer = null;

function isOwner() { return getSession().role === "OWNER"; }
function guardOwner(actionLabel = "this Owner action") {
  if (isOwner()) return true;
  alert(`Owner / Administrator clearance required for ${actionLabel}.`);
  return false;
}

function addMobileAudit(action, detail) {
  const bCode = getPairing().branchCode || "LOC-MAIN";
  db.audit.unshift({ time: nowIso(), branchCode: bCode, actor: getSession().role, action, detail });
  if (db.audit.length > 500) db.audit = db.audit.slice(0, 500);
}

function renderTop() {
  const pair = getPairing();
  const sess = getSession();
  document.getElementById("topSub").textContent = pair.paired
    ? `${pair.branchCode} • ${pair.endpoint}`
    : `Standalone • ${pair.branchCode}`;
  document.getElementById("rolePill").textContent = sess.role === "OWNER" ? "Owner • Full" : "Staff • POS";
  const adminBtn = document.querySelector('.nav-btn[data-tab="admin"]');
  if (adminBtn) adminBtn.style.opacity = sess.role === "OWNER" ? "1" : "0.65";
}

/* ==================== BIOMETRIC WITH SAFE PIN FALLBACK ==================== */
function verifyOwnerWithBiometricOrPin(onSuccess) {
  const sess = getSession();
  const askPin = (reason) => {
    const entered = prompt(`${reason}\nEnter Owner / Administrator PIN (default 0000):`);
    if (entered !== null && entered.trim() === (sess.ownerPin || "0000")) {
      sess.role = "OWNER";
      saveSession(sess);
      addMobileAudit("OWNER_UNLOCK", "Verified Owner clearance via PIN");
      saveDb();
      renderTop(); render();
      toast("Owner clearance verified");
      if (typeof onSuccess === "function") onSuccess();
    } else if (entered !== null) {
      alert("Invalid Owner PIN.");
    }
  };

  if (window.AndroidBiometric && typeof window.AndroidBiometric.authenticate === "function") {
    window.__bioCallback = (ok, status) => {
      if (ok) {
        sess.role = "OWNER";
        saveSession(sess);
        addMobileAudit("OWNER_UNLOCK", "Verified Owner clearance via Biometric");
        saveDb();
        renderTop(); render();
        toast("Biometric clearance verified");
        if (typeof onSuccess === "function") onSuccess();
      } else {
        askPin(status === "UNAVAILABLE" ? "Biometric sensor unavailable on this device." : "Biometric verification cancelled.");
      }
    };
    try {
      window.AndroidBiometric.authenticate("window.__bioCallback");
    } catch (_) {
      askPin("Biometric prompt unavailable.");
    }
  } else {
    askPin("Verify Owner / Administrator clearance:");
  }
}

function switchClearancePrompt() {
  const sess = getSession();
  if (sess.role === "OWNER") {
    if (confirm("Switch terminal to restricted Staff / Dispenser mode?")) {
      sess.role = "STAFF";
      saveSession(sess);
      if (activeTab === "admin") activeTab = "sell";
      renderTop(); render();
      toast("Switched to Staff / Dispenser mode");
    }
  } else {
    verifyOwnerWithBiometricOrPin();
  }
}

/* ==================== DUAL QR PAYLOAD PARSER & AUTO-DISCOVERY ==================== */
function applyGatewayQrString(rawText) {
  const txt = String(rawText || "").trim();
  const parts = txt.split("|");

  if (parts.length >= 6 && parts[0] === "SSEDDUME-POS") {
    const role = parts[1].toUpperCase() === "OWNER" ? "OWNER" : "STAFF";
    const endpoint = parts[4].replace(/\/+$/, "");
    if (endpoint.includes("127.0.0.1") || endpoint.includes("localhost")) {
      alert("Windows showed 127.0.0.1 instead of its hotspot IP. Connect both devices to the same Wi-Fi/hotspot and click 'Refresh LAN & Sync' on Windows first.");
      return false;
    }
    const pair = {
      paired: true,
      role,
      branchCode: parts[2] || "LOC-MAIN",
      host: parts[3] || "STATION",
      endpoint,
      token: parts[5]
    };
    savePairing(pair);
    db = loadDb();
    const sess = getSession();
    sess.role = role;
    saveSession(sess);
    renderTop(); render();
    syncWithGateway();
    toast(`Paired to ${pair.branchCode} (${role})`);
    return true;
  }

  if (parts.length >= 4 && parts[0] === "SSEDDUME-WIN") {
    const endpoint = parts[2].replace(/\/+$/, "");
    const pair = {
      paired: true,
      role: "OWNER",
      branchCode: "LOC-MAIN",
      host: parts[1] || "STATION",
      endpoint,
      token: parts[3]
    };
    savePairing(pair);
    db = loadDb();
    renderTop(); render();
    syncWithGateway();
    toast(`Paired to ${pair.host}`);
    return true;
  }

  alert("Invalid gateway QR code. Expected SSEDDUME-POS|... from the Windows station.");
  return false;
}

async function autoDiscoverWindowsGateway() {
  toast("Scanning hotspot/LAN for Windows Gateway...");
  const candidates = [];
  const commonHotspotHosts = [
    "192.168.137.1", "192.168.137.2", "192.168.137.10", "192.168.137.20",
    "192.168.43.1", "192.168.43.10", "192.168.43.20",
    "172.20.10.1", "172.20.10.2", "192.168.1.1", "192.168.0.1"
  ];
  for (const h of commonHotspotHosts) candidates.push(`http://${h}:8080`);

  const pair = getPairing();
  if (pair.endpoint && !pair.endpoint.includes("127.0.0.1")) {
    candidates.unshift(pair.endpoint);
  }

  for (const base of [...new Set(candidates)]) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 700);
      const r = await fetch(`${base}/api/ping`, { signal: ctrl.signal });
      clearTimeout(t);
      if (r.ok) {
        const info = await r.json();
        if (info && info.service === "SSEDDUME-POS") {
          const token = prompt(`Found ${info.host} (${info.branchCode}) at ${base}\nEnter Staff or Owner token from Windows:`);
          if (token && token.trim()) {
            const role = token.trim().toUpperCase().startsWith("OWN-") ? "OWNER" : "STAFF";
            return applyGatewayQrString(`SSEDDUME-POS|${role}|${info.branchCode || "LOC-MAIN"}|${info.host || "STATION"}|${base}|${token.trim()}`);
          }
          return false;
        }
      }
    } catch (_) {}
  }

  alert("No SSEDDUME Windows Gateway responded automatically. Scan the QR code or tap 'Paste / Enter Payload'.");
  return false;
}

/* ==================== GATEWAY SYNC (/api/events & /api/admin/*) ==================== */
function emitMobileEvent(eventType, payload) {
  const pair = getPairing();
  const bCode = pair.branchCode || "LOC-MAIN";
  const ev = {
    event_id: `${bCode}-${getDevId()}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    branch_id: bCode,
    device_id: getDevId(),
    event_type: eventType,
    payload
  };
  db.appliedEvents.push(ev.event_id);
  if (db.appliedEvents.length > 8000) db.appliedEvents = db.appliedEvents.slice(-8000);
  db.outbox.push(ev);
  saveDb();
  syncWithGateway();
}

function applyRemoteEvent(ev) {
  if (!ev || !ev.event_id) return false;
  const pair = getPairing();
  if (ev.branch_id && pair.branchCode && ev.branch_id !== pair.branchCode) return false;
  if (db.appliedEvents.includes(ev.event_id)) return false;
  db.appliedEvents.push(ev.event_id);

  const p = ev.payload || {};
  if (ev.event_type === "MED_UPSERT" && p.med) {
    const i = db.medicines.findIndex(m => m.id === p.med.id);
    if (i >= 0) Object.assign(db.medicines[i], p.med);
    else db.medicines.push(p.med);
  } else if (ev.event_type === "BATCH_GRN" && p.batch) {
    if (!db.batches.some(b => b.id === p.batch.id)) db.batches.push(p.batch);
  } else if (ev.event_type === "BATCH_DELTA" && p.batchId && Number.isInteger(p.delta)) {
    const b = db.batches.find(x => x.id === p.batchId);
    if (b) b.qty = Math.max(0, b.qty + p.delta);
  } else if (ev.event_type === "STOCK_ADJUST" && p.batchId && Number.isInteger(p.newQty)) {
    const b = db.batches.find(x => x.id === p.batchId);
    if (b) b.qty = Math.max(0, p.newQty);
  } else if (ev.event_type === "SALE_LINE" && p.sale) {
    if (!db.sales.some(s => s.id === p.sale.id)) db.sales.unshift(p.sale);
  } else if (ev.event_type === "SALE_VOID" && p.saleId) {
    const s = db.sales.find(x => x.id === p.saleId);
    if (s && !s.voided) {
      s.voided = true; s.cashPaid = 0; s.mmPaid = 0;
      const b = db.batches.find(x => x.id === s.batchId);
      if (b) b.qty += s.qty;
    }
  } else if (ev.event_type === "CREDIT_UPSERT" && p.credit) {
    const idx = db.credits.findIndex(c => c.id === p.credit.id);
    if (idx >= 0) Object.assign(db.credits[idx], p.credit);
    else db.credits.unshift(p.credit);
  }
  return true;
}

async function syncWithGateway() {
  const pair = getPairing();
  if (!pair.paired || !pair.endpoint || !pair.token) return;
  try {
    if (db.outbox.length > 0) {
      const postRes = await fetch(`${pair.endpoint}/api/events`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Pair-Token": pair.token },
        body: JSON.stringify(db.outbox)
      });
      if (postRes.ok) {
        db.outbox = [];
        saveDb();
      }
    }
    const getRes = await fetch(`${pair.endpoint}/api/events`, {
      headers: { "X-Pair-Token": pair.token },
      cache: "no-store"
    });
    if (getRes.ok) {
      const events = await getRes.json();
      let changed = false;
      for (const ev of events) {
        if (applyRemoteEvent(ev)) changed = true;
      }
      if (changed) {
        saveDb();
        render();
        toast("Synced stock & sales with Windows");
      }
    }
  } catch (_) {}
}
setInterval(syncWithGateway, 5000);

/* ==================== CAMERA & MANUAL SCANNER ==================== */
async function openScanner(mode) {
  scanMode = mode;
  document.getElementById("scanTitle").textContent = mode === "PAIR" ? "Scan Windows Gateway QR" : "Scan Medicine Barcode";
  document.getElementById("scannerModal").style.display = "flex";
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const vid = document.getElementById("scanVideo");
    vid.srcObject = scanStream;
    if ("BarcodeDetector" in window) {
      const detector = new BarcodeDetector({ formats: ["qr_code", "ean_13", "ean_8", "code_128", "upc_a"] });
      scanTimer = setInterval(async () => {
        try {
          const codes = await detector.detect(vid);
          if (codes && codes.length > 0) {
            const val = codes[0].rawValue;
            stopScanner();
            handleScannedValue(val);
          }
        } catch (_) {}
      }, 350);
    }
  } catch (_) {}
}

function stopScanner() {
  clearInterval(scanTimer);
  scanTimer = null;
  if (scanStream) {
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }

/* ==================== STOCK & FEFO HELPERS ==================== */
function batchState(b) {
  if (b.quarantined) return "QUARANTINED";
  if (b.expiry < todayStr()) return "EXPIRED";
  if (b.expiry === todayStr()) return "EXPIRES_TODAY";
  if (b.qty <= 0) return "DEPLETED";
  return "ACTIVE";
}
function isEligible(b) { return batchState(b) === "ACTIVE"; }
function availQty(medId) {
  return db.batches.filter(b => b.medId === medId && isEligible(b)).reduce((s, b) => s + b.qty, 0);
}
function openCreditTotal() {
  return money(db.credits.filter(c => !c.settled).reduce((s, c) => s + money(c.balance), 0));
}

function addToCart() {

  const qty = parseInt(document.getElementById("mQty")?.value || "0", 10);
  const unitPrice = money(parseFloat(document.getElementById("mPrice")?.value || med?.default_unit_price || "0"));
  const dosage = (document.getElementById("mDosage")?.value || "").trim();
  if (!med || med.nda_schedule === "RESTRICTED") return alert("Select an authorized preparation.");
  if (!Number.isInteger(qty) || qty <= 0) return alert("Enter a valid quantity.");
  const inCart = basket.filter(x => x.medId === med.id).reduce((s, x) => s + x.qty, 0);
  if (qty + inCart > availQty(med.id)) return alert(`Only ${availQty(med.id)} ${med.base_unit} available.`);
  basket.push({ medId: med.id, medName: `${med.generic_name}${med.strength ? " (" + med.strength + ")" : ""}`, baseUnit: med.base_unit, qty, unitPrice, dosage });
  render(); toast("Added to cart");

function executeSaleLines(lines, payMethod, cashPaid, mmPaid, payRef, crCust, crBal) {
  const bCode = getPairing().branchCode || "LOC-MAIN";
  const rcpId = `VCH-${bCode}-${Date.now()}`;
  const grand = money(lines.reduce((s, it) => s + money(it.qty * it.unitPrice), 0));
  for (const it of lines) {
    let rem = it.qty;
    const batches = db.batches.filter(b => b.medId === it.medId && isEligible(b)).sort((a, b) => a.expiry.localeCompare(b.expiry));
    for (const b of batches) {
      if (rem <= 0) break;
      const take = Math.min(b.qty, rem);
      b.qty = Math.max(0, b.qty - take);
      rem -= take;
      const lTot = money(take * it.unitPrice);
      const ratio = grand > 0 ? lTot / grand : 0;
      const sale = {
        id: `S-${bCode}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        branchCode: bCode, receiptId: rcpId, time: nowIso(),
        medId: it.medId, medName: it.medName, batchId: b.id, batchNo: b.batchNo,
        qty: take, unitPrice: it.unitPrice, total: lTot,
        payMethod, cashPaid: money(cashPaid * ratio), mmPaid: money(mmPaid * ratio),
        payRef: payRef || (crCust ? `Credit: ${crCust}` : ""),
        dosage: it.dosage, dispenser: getSession().role, voided: false
      };
      db.sales.unshift(sale);
      emitMobileEvent("BATCH_DELTA", { batchId: b.id, delta: -take });
      emitMobileEvent("SALE_LINE", { sale });
    }
    addMobileAudit("DISPENSE", `[${rcpId}] ${it.qty} ${it.baseUnit} ${it.medName} (${payMethod})`);
  }
  if (payMethod === "CREDIT" && crBal > 0) {
    const cr = { id: `CRD-${bCode}-${Date.now()}`, branchCode: bCode, receiptId: rcpId, time: nowIso(), customer: crCust, total: grand, paid: cashPaid, balance: crBal, settled: false };
    db.credits.unshift(cr);
    emitMobileEvent("CREDIT_UPSERT", { credit: cr });
  }
  saveDb(); render(); openVoucher(rcpId);
}
function quickDispenseDirect() {
  const med = db.medicines.find(m => m.id === document.getElementById("mSel")?.value);
  const qty = parseInt(document.getElementById("mQty")?.value || "0", 10);
  const unitPrice = money(parseFloat(document.getElementById("mPrice")?.value || med?.default_unit_price || "0"));
  const dosage = (document.getElementById("mDosage")?.value || "").trim();
  if (!med || med.nda_schedule === "RESTRICTED" || qty <= 0) return alert("Select a medicine and valid quantity.");
  if (qty > availQty(med.id)) return alert("Insufficient eligible stock.");
  const line = { medId: med.id, medName: `${med.generic_name}${med.strength ? " (" + med.strength + ")" : ""}`, baseUnit: med.base_unit, qty, unitPrice, dosage };
  const total = money(qty * unitPrice);
  executeSaleLines([line], "CASH", total, 0, "", "", 0);
}
function checkoutCart() {
  if (!basket.length) return alert("Dispensing cart is empty.");
  const grand = money(basket.reduce((s, x) => s + money(x.qty * x.unitPrice), 0));
  const payMethod = document.getElementById("cartPay")?.value || "CASH";
  const payRef = (document.getElementById("cSpRef")?.value || "").trim();
  let cashPaid = 0, mmPaid = 0, crCust = "", crBal = 0;
  if (payMethod === "CASH") cashPaid = grand;
  else if (payMethod === "MOBILE_MONEY") mmPaid = grand;
  else if (payMethod === "SPLIT") {
    cashPaid = money(parseFloat(document.getElementById("cSpCash")?.value || "0"));
    mmPaid = money(parseFloat(document.getElementById("cSpMm")?.value || "0"));
    if (Math.abs(money(cashPaid + mmPaid) - grand) >= 0.01) return alert("Split cash + MM must equal cart total.");
  } else if (payMethod === "CREDIT") {
    crCust = (document.getElementById("cCrCust")?.value || "").trim();
    const dep = money(parseFloat(document.getElementById("cCrDep")?.value || "0"));
    if (!crCust) return alert("Enter customer / account name for credit.");
    if (dep < 0 || dep >= grand) return alert("Deposit must be >= 0 and less than total.");
    cashPaid = dep;
    crBal = money(grand - dep);
  }
  const lines = [...basket];
  basket = [];
  executeSaleLines(lines, payMethod, cashPaid, mmPaid, payRef, crCust, crBal);
}
function voidSale(id) {
  if (!guardOwner("voiding dispensing vouchers")) return;
  const s = db.sales.find(x => x.id === id);
  if (!s || s.voided) return;
  const reason = (prompt("Reason for voiding voucher:") || "").trim();
  if (!reason) return alert("Void reason is required.");
  s.voided = true; s.cashPaid = 0; s.mmPaid = 0;
  const b = db.batches.find(x => x.id === s.batchId);
  if (b) b.qty += s.qty;
  emitMobileEvent("SALE_VOID", { saleId: s.id });
  addMobileAudit("VOID_VOUCHER", `Voided ${s.id} (${s.medName}) — ${reason}`);
  saveDb(); render(); toast("Voucher voided");
}

function adjustStockCount(id) {
  if (!guardOwner("adjusting physical stock counts")) return;

  if (raw === null) return;

  b.qty = newQty;

  saveDb(); render(); toast("Stock adjusted");

    <div class="card">
      <h3>Register Formulary Item</h3>
      <div class="row">
        <input id="fGen" type="text" placeholder="Generic Name *" style="flex:1;" />
        <input id="fStr" type="text" placeholder="Strength" style="width:110px;" />
      </div>
      <div class="row">
        <input id="fBrand" type="text" placeholder="Brand" style="flex:1;" />
        <input id="fUnit" type="text" value="TABLET" style="width:105px;" />
        <input id="fPrice" type="number" step="0.01" placeholder="Price" style="width:100px;" />
      </div>
      <div class="row" style="margin-bottom:0;">
        <input id="fBar" type="text" placeholder="Barcode (optional)" style="flex:1;" />
        <button class="dark" onclick="openScanner('BARCODE')">Scan</button>
        <button class="primary" onclick="saveMobileMed()">Save Item</button>
      </div>
    </div>
    <div class="card">
      <h3>Formulary (${db.medicines.length})</h3>
      <div class="table-wrap"><table><thead><tr><th>Medicine</th><th>Stock</th><th>Price</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
  `;
}
function saveMobileMed() {
  const generic_name = document.getElementById("fGen").value.trim();
  if (!generic_name) return alert("Generic name is required.");
  const bCode = getPairing().branchCode || "LOC-MAIN";
  const med = {
    id: `M-${bCode}-${Date.now()}`,
    generic_name,
    brand_name: document.getElementById("fBrand").value.trim(),
    strength: document.getElementById("fStr").value.trim(),
    base_unit: (document.getElementById("fUnit").value || "TABLET").trim().toUpperCase(),
    default_unit_price: money(parseFloat(document.getElementById("fPrice").value || "0")),
    barcode: document.getElementById("fBar").value.trim(),
    reorder_level: 10,
    nda_schedule: "CLASS_C"
  };
  db.medicines.push(med);
  emitMobileEvent("MED_UPSERT", { med });
  addMobileAudit("FORMULARY_ADD", `Added ${generic_name}`);
  saveDb(); render(); toast("Medicine saved");
}

function renderReports(el) {
  const crRows = db.credits.filter(c => !c.settled).map(c => `
    <tr>
      <td><strong>${esc(c.customer)}</strong><br><small>${esc(c.receiptId)}</small></td>
      <td>${money(c.balance).toFixed(2)}</td>
      <td><button class="primary" onclick="settleMobileCredit('${esc(c.id)}')">Settle</button></td>
    </tr>
  `).join("") || `<tr><td colspan="3" style="color:var(--muted);">No open credit accounts.</td></tr>`;

  const auditHtml = isOwner()
    ? `<div class="card"><h3>Audit Trail (${db.audit.length})</h3><div class="table-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>Detail</th></tr></thead><tbody>${
        db.audit.slice(0, 30).map(a => `<tr><td>${esc(a.time.slice(0, 16).replace("T", " "))}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join("") || `<tr><td colspan="3" style="color:var(--muted);">No audit entries.</td></tr>`
      }</tbody></table></div></div>`
    : `<div class="alert alert-warn">Switch to <b>Owner</b> clearance to view full audit logs.</div>`;

  el.innerHTML = `
    <div class="card">
      <h3>Open Credit Accounts (${money(openCreditTotal()).toFixed(2)})</h3>
      <div class="table-wrap"><table><thead><tr><th>Customer</th><th>Balance</th><th>Action</th></tr></thead><tbody>${crRows}</tbody></table></div>
    </div>
    ${auditHtml}
  `;
}
function settleMobileCredit(id) {
  const c = db.credits.find(x => x.id === id);
  if (!c) return;
  const amt = money(parseFloat(prompt(`Open balance: ${money(c.balance).toFixed(2)}. Settlement amount:`) || "0"));
  if (!(amt > 0 && amt <= money(c.balance))) return alert("Invalid settlement amount.");
  c.balance = money(c.balance - amt);
  if (c.balance <= 0) c.settled = true;
  emitMobileEvent("CREDIT_UPSERT", { credit: c });
  addMobileAudit("CREDIT_SETTLE", `Settled ${amt.toFixed(2)} on ${c.receiptId}`);
  saveDb(); render(); toast("Credit settled");
}

function renderAdmin(el) {
  if (!guardOwner("viewing Owner Administration")) {
    activeTab = "sell";
    return renderSell(el);
  }
  const pair = getPairing();
  el.innerHTML = `
    <div class="card">
      <h3>Owner Clearance &amp; Security</h3>
      <div class="row" style="margin-bottom:0;">
        <button class="primary" onclick="verifyOwnerWithBiometricOrPin()">Verify Biometric / PIN</button>
        <button class="ghost" onclick="changeMobileOwnerPin()">Change Owner PIN</button>
        <button class="ghost" onclick="exportMobileJson()">Export Branch JSON</button>
      </div>
    </div>

    <div class="card">
      <h3>Windows Gateway &amp; Branch Control</h3>
      <div style="font-size:12.5px;margin-bottom:10px;">
        Branch: <b>${esc(pair.branchCode)}</b> • Endpoint: <b>${esc(pair.endpoint || "Not paired")}</b> • Outbox: <b>${db.outbox.length}</b>
      </div>
      <div class="row">
        <button class="accent" onclick="openScanner('PAIR')">Scan Windows QR</button>
        <button class="dark" onclick="autoDiscoverWindowsGateway()">Auto-Find Gateway</button>
        <button class="primary" onclick="syncWithGateway()">Flush &amp; Sync</button>
      </div>
      <div class="row" style="margin-bottom:0;">
        <button class="ghost" onclick="remoteRotateWindowsKeys()">Rotate Windows Keys</button>
        <button class="ghost" onclick="remoteSetWindowsBranch()">Set Windows Branch</button>
        <button class="danger" onclick="unpairStation()">Unpair</button>
      </div>
    </div>
  `;
}

async function remoteRotateWindowsKeys() {
  const pair = getPairing();
  if (!pair.paired || !pair.endpoint || !pair.token) return alert("Pair with Windows first.");
  try {
    const r = await fetch(`${pair.endpoint}/api/admin/rotate-keys`, {
      method: "POST",
      headers: { "X-Pair-Token": pair.token }
    });
    if (!r.ok) return alert("Windows rejected key rotation (Owner token required).");
    const info = await r.json();
    pair.token = info.ownerToken || pair.token;
    savePairing(pair);
    addMobileAudit("REMOTE_KEY_ROTATION", `Rotated keys on ${pair.branchCode}`);
    saveDb(); renderTop(); render();
    toast("Windows keys rotated — rescan QR for new tokens");
  } catch (err) {
    alert("Failed to rotate keys: " + (err?.message || err));
  }
}

async function remoteSetWindowsBranch() {
  const pair = getPairing();
  if (!pair.paired || !pair.endpoint || !pair.token) return alert("Pair with Windows first.");
  const branchName = (prompt("New Location Name (e.g., SSEDDUME - MENGO):", pair.branchCode) || "").trim();
  if (!branchName) return;
  const branchCode = (prompt("New Location Code (e.g., LOC-MENGO):", pair.branchCode) || "").trim().toUpperCase();
  if (!branchCode) return;
  try {
    const r = await fetch(`${pair.endpoint}/api/admin/branch`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Pair-Token": pair.token },
      body: JSON.stringify({ branchCode, branchName })
    });
    if (!r.ok) return alert("Windows rejected branch update.");
    const info = await r.json();
    pair.branchCode = info.branchCode || branchCode;
    savePairing(pair);
    db = loadDb();
    addMobileAudit("REMOTE_BRANCH_SET", `Updated branch to ${branchName} (${pair.branchCode})`);
    saveDb(); renderTop(); render();
    toast(`Branch set to ${pair.branchCode}`);
  } catch (err) {
    alert("Failed to update branch: " + (err?.message || err));
  }
}

function exportMobileJson() {
  const pair = getPairing();
  const pkg = { system: "SSEDDUME DRUG SHOP MANAGEMENT SYSTEM", branchCode: pair.branchCode, exportedAt: nowIso(), data: db };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(pkg, null, 2)], { type: "application/json" }));
  a.download = `sseddume-mobile-${(pair.branchCode || "loc-main").toLowerCase()}-${todayStr()}.json`;
  a.click();
  toast("Exported branch JSON");
}

function changeMobileOwnerPin() {
  verifyOwnerWithBiometricOrPin(() => {
    const sess = getSession();
    const next = prompt("Enter new 4-digit Owner PIN:", sess.ownerPin || "0000");
    if (next && next.trim()) {
      sess.ownerPin = next.trim();
      saveSession(sess);
      toast("Owner PIN updated");
    }
  });
}

function unpairStation() {
  if (!confirm("Unpair this Android device from the Windows station?")) return;
  savePairing({ paired: false, role: "OWNER", branchCode: "LOC-MAIN", host: "", endpoint: "", token: "" });
  db = loadDb();
  renderTop(); render(); toast("Station unpaired");
}

renderTop();
render();
syncWithGateway();
</script>
</body>
</html>
